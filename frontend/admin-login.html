<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Admin Login | DPD Agro Fresh</title>


    <!-- ========================================================
         BOOTSTRAP
    ========================================================= -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- ========================================================
         BOOTSTRAP ICONS
    ========================================================= -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- ========================================================
         GOOGLE FONT
    ========================================================= -->

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family: 'Poppins', sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #1b5e20,
                    #2e7d32,
                    #66bb6a
                );

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

        }


        /* ====================================================
           LOGIN CARD
        ==================================================== */

        .login-card {

            width: 100%;

            max-width: 430px;

            background: #ffffff;

            border-radius: 22px;

            padding: 40px;

            box-shadow:
                0 25px 60px rgba(0,0,0,0.20);

        }


        /* ====================================================
           LOGO
        ==================================================== */

        .logo {

            width: 70px;

            height: 70px;

            border-radius: 50%;

            background: #e8f5e9;

            color: #2e7d32;

            display: flex;

            align-items: center;

            justify-content: center;

            margin: 0 auto 20px;

            font-size: 32px;

        }


        .login-title {

            text-align: center;

            font-weight: 700;

            color: #222;

            margin-bottom: 5px;

        }


        .login-subtitle {

            text-align: center;

            color: #777;

            font-size: 14px;

            margin-bottom: 30px;

        }


        /* ====================================================
           FORM
        ==================================================== */

        .form-label {

            font-weight: 600;

            color: #333;

        }


        .form-control {

            height: 52px;

            border-radius: 12px;

            border: 1px solid #d9e3da;

        }


        .form-control:focus {

            border-color: #2e7d32;

            box-shadow:
                0 0 0 3px rgba(46,125,50,0.12);

        }


        /* ====================================================
           INPUT GROUP
        ==================================================== */

        .input-group-text {

            background: #f8faf8;

            border-color: #d9e3da;

            color: #2e7d32;

        }


        /* ====================================================
           LOGIN BUTTON
        ==================================================== */

        .login-btn {

            width: 100%;

            height: 52px;

            border: none;

            border-radius: 12px;

            background: #2e7d32;

            color: #fff;

            font-weight: 600;

            font-size: 15px;

            transition: 0.3s ease;

        }


        .login-btn:hover {

            background: #1b5e20;

            transform: translateY(-1px);

        }


        .login-btn:disabled {

            opacity: 0.7;

            cursor: not-allowed;

            transform: none;

        }


        /* ====================================================
           ERROR MESSAGE
        ==================================================== */

        #loginError {

            display: none;

            border-radius: 10px;

            font-size: 14px;

        }


        /* ====================================================
           SUCCESS MESSAGE
        ==================================================== */

        #loginSuccess {

            display: none;

            border-radius: 10px;

            font-size: 14px;

        }


        /* ====================================================
           FOOTER
        ==================================================== */

        .login-footer {

            text-align: center;

            margin-top: 25px;

            color: #999;

            font-size: 12px;

        }


        /* ====================================================
           MOBILE
        ==================================================== */

        @media (max-width: 500px) {

            .login-card {

                padding: 30px 22px;

            }

        }

    </style>

</head>


<body>


    <!-- ========================================================
         LOGIN CARD
    ========================================================= -->

    <div class="login-card">


        <!-- ====================================================
             LOGO
        ===================================================== -->

        <div class="logo">

            <i class="bi bi-shield-lock-fill"></i>

        </div>


        <!-- ====================================================
             TITLE
        ===================================================== -->

        <h2 class="login-title">

            Admin Login

        </h2>


        <p class="login-subtitle">

            DPD Agro Fresh Management Panel

        </p>


        <!-- ====================================================
             ERROR MESSAGE
        ===================================================== -->

        <div
            id="loginError"
            class="alert alert-danger">

            Invalid username or password.

        </div>


        <!-- ====================================================
             SUCCESS MESSAGE
        ===================================================== -->

        <div
            id="loginSuccess"
            class="alert alert-success">

            Login successful. Redirecting...

        </div>


        <!-- ====================================================
             LOGIN FORM
        ===================================================== -->

        <form id="loginForm">


            <!-- =================================================
                 USERNAME
            ================================================== -->

            <div class="mb-3">

                <label
                    for="username"
                    class="form-label">

                    Username

                </label>


                <div class="input-group">

                    <span class="input-group-text">

                        <i class="bi bi-person"></i>

                    </span>


                    <input
                        type="text"
                        id="username"
                        class="form-control"
                        placeholder="Enter admin username"
                        autocomplete="username"
                        required>

                </div>

            </div>


            <!-- =================================================
                 PASSWORD
            ================================================== -->

            <div class="mb-4">

                <label
                    for="password"
                    class="form-label">

                    Password

                </label>


                <div class="input-group">

                    <span class="input-group-text">

                        <i class="bi bi-lock"></i>

                    </span>


                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="Enter admin password"
                        autocomplete="current-password"
                        required>

                </div>

            </div>


            <!-- =================================================
                 LOGIN BUTTON
            ================================================== -->

            <button
                type="submit"
                id="loginButton"
                class="login-btn">

                <i class="bi bi-box-arrow-in-right"></i>

                Login

            </button>


        </form>


        <!-- ====================================================
             FOOTER
        ===================================================== -->

        <div class="login-footer">

            © 2026 DPD Agro Fresh

        </div>


    </div>


    <!-- ========================================================
         JAVASCRIPT
    ========================================================= -->

    <script>


        // ========================================================
        // DOM ELEMENTS
        // ========================================================

        const loginForm =
            document.getElementById("loginForm");


        const loginButton =
            document.getElementById("loginButton");


        const loginError =
            document.getElementById("loginError");


        const loginSuccess =
            document.getElementById("loginSuccess");


        // ========================================================
        // LOGIN FORM SUBMIT
        // ========================================================

        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                // =================================================
                // GET USERNAME
                // =================================================

                const username =
                    document
                        .getElementById("username")
                        .value
                        .trim();


                // =================================================
                // GET PASSWORD
                // =================================================

                const password =
                    document
                        .getElementById("password")
                        .value;


                // =================================================
                // HIDE OLD MESSAGES
                // =================================================

                loginError.style.display =
                    "none";

                loginSuccess.style.display =
                    "none";


                // =================================================
                // VALIDATION
                // =================================================

                if (!username || !password) {

                    loginError.textContent =
                        "Please enter username and password.";

                    loginError.style.display =
                        "block";

                    return;

                }


                // =================================================
                // DISABLE LOGIN BUTTON
                // =================================================

                loginButton.disabled = true;

                loginButton.innerHTML = `

                    <span
                        class="spinner-border spinner-border-sm me-2">
                    </span>

                    Logging in...

                `;


                try {


                    // =================================================
                    // CREATE FORM DATA
                    //
                    // IMPORTANT:
                    //
                    // AdminController uses:
                    //
                    // @RequestParam String username
                    // @RequestParam String password
                    //
                    // Therefore we send form-urlencoded data.
                    // =================================================

                    const formData =
                        new URLSearchParams();


                    formData.append(
                        "username",
                        username
                    );


                    formData.append(
                        "password",
                        password
                    );


                    // =================================================
                    // CALL SPRING BOOT LOGIN API
                    // =================================================

                    const response =
                        await fetch(
                            "http://localhost:8080/api/admin/login",
                            {

                                method: "POST",

                                headers: {

                                    "Content-Type":
                                        "application/x-www-form-urlencoded"

                                },

                                body: formData

                            }
                        );


                    // =================================================
                    // BACKEND RETURNS PLAIN TEXT
                    //
                    // Example:
                    //
                    // Login successful
                    //
                    // Therefore use response.text()
                    // NOT response.json()
                    // =================================================

                    const result =
                        await response.text();


                    console.log(
                        "Admin login status:",
                        response.status
                    );


                    console.log(
                        "Admin login response:",
                        result
                    );


                    // =================================================
                    // SUCCESS
                    // =================================================

                    if (response.ok) {


                        // ---------------------------------------------
                        // SAVE LOGIN SESSION FLAG
                        // ---------------------------------------------

                        sessionStorage.setItem(
                            "dpdAdminLoggedIn",
                            "true"
                        );


                        sessionStorage.setItem(
                            "dpdAdminUsername",
                            username
                        );


                        // ---------------------------------------------
                        // SHOW SUCCESS
                        // ---------------------------------------------

                        loginSuccess.textContent =
                            "Login successful. Redirecting...";

                        loginSuccess.style.display =
                            "block";


                        // ---------------------------------------------
                        // REDIRECT TO ADMIN PANEL
                        // ---------------------------------------------

                        setTimeout(
                            function() {

                                window.location.href =
                                    "admin.html";

                            },
                            500
                        );


                        return;

                    }


                    // =================================================
                    // LOGIN FAILED
                    // =================================================

                    loginError.textContent =
                        result ||
                        "Invalid username or password.";

                    loginError.style.display =
                        "block";


                } catch (error) {


                    // =================================================
                    // NETWORK / SERVER ERROR
                    // =================================================

                    console.error(
                        "Admin login error:",
                        error
                    );


                    loginError.textContent =
                        "Unable to connect to the server. Make sure Spring Boot is running.";

                    loginError.style.display =
                        "block";

                }


                // =================================================
                // RESTORE LOGIN BUTTON
                // =================================================

                loginButton.disabled = false;

                loginButton.innerHTML = `

                    <i class="bi bi-box-arrow-in-right"></i>

                    Login

                `;

            }
        );

    </script>


</body>

</html>
